# Shared generation job used by the "Generate · ..." workflows.
# Callers assemble the config; this runs the generator, writes the config and
# the part manifest into the job summary, and uploads the parts as an artifact.
name: generate (shared)

on:
  workflow_call:
    inputs:
      title:
        required: true
        type: string
      artifact:
        required: true
        type: string
      base_config:
        required: true
        type: string
      overrides:
        description: "One --set argument per line, dotted.path=value"
        required: false
        default: ""
        type: string
      extra_yaml:
        description: "YAML fragment merged last, over everything else"
        required: false
        default: ""
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the config
        env:                       # env indirection keeps inputs out of the script
          BASE_CONFIG: ${{ inputs.base_config }}
          OVERRIDES: ${{ inputs.overrides }}
          EXTRA_YAML: ${{ inputs.extra_yaml }}
        run: |
          set -o pipefail
          # tokens only - they become python argv entries, never shell code
          SETS=()
          while IFS= read -r line; do
            [ -n "$line" ] && SETS+=(--set "$line")
          done <<< "$OVERRIDES"
          python tools/build_config.py \
            --base "$BASE_CONFIG" \
            "${SETS[@]}" \
            --merge "$EXTRA_YAML" \
            -o bag.yaml

      - name: Generate
        run: |
          set -o pipefail
          python -m src.cli generate --config bag.yaml --out out/ | tee report.txt

      - name: Write the job summary
        if: always()
        env:
          TITLE: ${{ inputs.title }}
        run: |
          {
            echo "## $TITLE"
            echo "### Config"
            echo '```yaml'
            cat bag.yaml 2>/dev/null || echo "the config was never built - see the log"
            echo '```'
            echo "### Parts"
            echo '```json'
            cat report.txt 2>/dev/null || echo "generation failed - see the log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-${{ github.run_number }}
          path: |
            out/
            bag.yaml
          if-no-files-found: error
